name: Bug report
description: Something is broken or giving the wrong result.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove passwords, tokens and other secrets from any sample input.
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool or page is affected?
      placeholder: e.g. JSON Formatter, /tool/json-formatter
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should the tool have done instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample input
      description: A minimal input that triggers the issue, with secrets removed.
      render: text
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 132 on macOS 15
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any secrets from the content above.
          required: true
