<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DevToolbox — 129 free browser-based developer tools">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23262f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0d13"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <g font-family="JetBrains Mono, SF Mono, Menlo, Monaco, monospace">
    <g transform="translate(80 64)">
      <rect width="56" height="56" rx="13.125" fill="#06d0f9"/>
      <g transform="scale(1.75)">
        <path d="M9.25 10.75 16 16l-6.75 5.25" fill="none" stroke="#0b0d13" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.75 21.25h5" fill="none" stroke="#0b0d13" stroke-width="2.75" stroke-linecap="round"/>
      </g>
    </g>
    <text x="152" y="102" fill="#e7ebef" font-size="30" font-weight="700" letter-spacing="0.5">DevToolbox</text>

    <text x="80" y="234" fill="#7e889a" font-size="22" letter-spacing="4">BROWSER-BASED DEVELOPER TOOLS</text>

    <text x="80" y="334" fill="#e7ebef" font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2">129 tools.</text>
    <text x="80" y="408" fill="#7e889a" font-family="Inter, SF Pro Text, Helvetica Neue, Arial, sans-serif" font-size="30">Format, convert, encode, hash and calculate.</text>
    <text x="80" y="452" fill="#7e889a" font-family="Inter, SF Pro Text, Helvetica Neue, Arial, sans-serif" font-size="30">Everything runs locally in your browser.</text>

    <g transform="translate(80 520)">
      <rect width="230" height="46" rx="23" fill="#12141c" stroke="#23262f"/>
      <circle cx="26" cy="23" r="5" fill="#06d0f9"/>
      <text x="44" y="30" fill="#e7ebef" font-size="17">No signup required</text>
    </g>
    <g transform="translate(330 520)">
      <rect width="238" height="46" rx="23" fill="#12141c" stroke="#23262f"/>
      <circle cx="26" cy="23" r="5" fill="#4ade80"/>
      <text x="44" y="30" fill="#e7ebef" font-size="17">Nothing uploaded</text>
    </g>

    <g transform="translate(760 176)">
      <rect width="360" height="330" rx="8" fill="#12141c" stroke="#23262f"/>
      <path d="M0 8a8 8 0 0 1 8-8h344a8 8 0 0 1 8 8v36H0Z" fill="#1d202a"/>
      <line x1="0" y1="44" x2="360" y2="44" stroke="#23262f"/>
      <circle cx="24" cy="22" r="5" fill="#f87171"/>
      <circle cx="44" cy="22" r="5" fill="#fbbf24"/>
      <circle cx="64" cy="22" r="5" fill="#4ade80"/>
      <text x="24" y="86" font-size="16"><tspan fill="#06d0f9">$</tspan><tspan fill="#e7ebef"> json format --stdin</tspan></text>
      <text x="24" y="120" fill="#7e889a" font-size="15">{</text>
      <text x="42" y="150" font-size="15"><tspan fill="#e7ebef">"status"</tspan><tspan fill="#7e889a">: </tspan><tspan fill="#4ade80">"formatted"</tspan><tspan fill="#7e889a">,</tspan></text>
      <text x="42" y="180" font-size="15"><tspan fill="#e7ebef">"privacy"</tspan><tspan fill="#7e889a">: </tspan><tspan fill="#4ade80">"local"</tspan><tspan fill="#7e889a">,</tspan></text>
      <text x="42" y="210" font-size="15"><tspan fill="#e7ebef">"upload"</tspan><tspan fill="#7e889a">: </tspan><tspan fill="#06d0f9">false</tspan></text>
      <text x="24" y="240" fill="#7e889a" font-size="15">}</text>
      <text x="24" y="282" fill="#7e889a" font-size="14">// no account. no telemetry.</text>
    </g>
  </g>
</svg>
