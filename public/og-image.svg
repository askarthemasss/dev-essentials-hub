<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DevToolbox — 129 free browser-based developer tools">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2533" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0f17"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="360" fill="url(#glow)"/>

  <g font-family="SF Mono, Menlo, Monaco, monospace">
    <g transform="translate(80 66)">
      <rect width="54" height="54" rx="12" fill="#101a27" stroke="#243247"/>
      <path d="M15 19 L25 27 L15 35" fill="none" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="35" x2="40" y2="35" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="152" y="104" fill="#d7dee8" font-size="30" font-weight="700" letter-spacing="1">DevToolbox</text>

    <text x="80" y="238" fill="#7d8da4" font-size="24" letter-spacing="4">DEVELOPER UTILITIES</text>
    <text x="80" y="336" fill="#f4f8fc" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2">129 tools.</text>
    <text x="80" y="410" fill="#9fb0c7" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif" font-size="32">Format, convert, encode, hash and calculate.</text>
    <text x="80" y="454" fill="#9fb0c7" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif" font-size="32">All processed locally in your browser.</text>

    <g transform="translate(80 520)">
      <rect width="230" height="46" rx="23" fill="#101a27" stroke="#243247"/>
      <circle cx="26" cy="23" r="5" fill="#00d4ff"/>
      <text x="44" y="30" fill="#d7dee8" font-size="17">No signup required</text>
    </g>
    <g transform="translate(330 520)">
      <rect width="238" height="46" rx="23" fill="#101a27" stroke="#243247"/>
      <circle cx="26" cy="23" r="5" fill="#22c55e"/>
      <text x="44" y="30" fill="#d7dee8" font-size="17">Nothing uploaded</text>
    </g>

    <g transform="translate(760 176)">
      <rect width="360" height="330" rx="18" fill="#0d1521" stroke="#263449"/>
      <rect width="360" height="46" rx="18" fill="#121d2c"/>
      <rect y="28" width="360" height="18" fill="#121d2c"/>
      <circle cx="24" cy="23" r="6" fill="#ef4444"/>
      <circle cx="44" cy="23" r="6" fill="#f59e0b"/>
      <circle cx="64" cy="23" r="6" fill="#22c55e"/>
      <text x="24" y="94" fill="#00d4ff" font-size="16">$ json format --stdin</text>
      <text x="24" y="128" fill="#6b7c93" font-size="15">{</text>
      <text x="42" y="158" fill="#d7dee8" font-size="15">"status": <tspan fill="#22c55e">"formatted"</tspan>,</text>
      <text x="42" y="188" fill="#d7dee8" font-size="15">"privacy": <tspan fill="#22c55e">"local"</tspan>,</text>
      <text x="42" y="218" fill="#d7dee8" font-size="15">"upload": <tspan fill="#00d4ff">false</tspan></text>
      <text x="24" y="248" fill="#6b7c93" font-size="15">}</text>
      <text x="24" y="292" fill="#4f6076" font-size="14">// no account. no telemetry.</text>
    </g>
  </g>
</svg>
